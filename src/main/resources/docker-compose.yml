services:
  mysql:
    image: mysql:8.4
    container_name: online-novel-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/online-novel.sql:/docker-entrypoint-initdb.d/online-novel.sql:ro
    networks:
      - novel_net

  redis:
    image: redis:7.4
    container_name: online-novel-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novel_net

  app:
    build:
      context: ./online-novel
      dockerfile: Dockerfile
    container_name: online-novel-app
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NOVEL_JWT_SECRET: ${NOVEL_JWT_SECRET}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    expose:
      - "8080"
    volumes:
      - ./online-novel/config:/app/config:ro
    networks:
      - novel_net

  nginx:
    image: nginx:1.27-alpine
    container_name: online-novel-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./online-novel-front-end/dist:/usr/share/nginx/html:ro
    networks:
      - novel_net

volumes:
  mysql_data:
  redis_data:

networks:
  novel_net:

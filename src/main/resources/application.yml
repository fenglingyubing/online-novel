spring:
  application:
    name: online-novel

--- # 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online-novel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

--- # Redis 配置
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379

--- # JWT 配置
novel:
  jwt:
    secret: myJwtSecretKey2026fenglingyubingfenglingwej1234567890
    ttl: 7200000

--- # MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml #  mappr文件路径
  configuration:
    map-underscore-to-camel-case: true #  驼峰映射

--- # 阿里云OSS 配置
aliyun:
  oss:
    endpoint: https://oss-cn-chengdu.aliyuncs.com
    bucket-name: online-novel
    url-prefix: https://online-novel.oss-cn-chengdu.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}

--- # 上传文件大小配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
